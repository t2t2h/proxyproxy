name: Build AflatoonSuite

on:
  push:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "رابط مباشر لملف IPA (اختياري) لحقن الـ dylib فيه"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          F=$(find . -name Tweak.xm -not -path './.theos/*' -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "::error::Tweak.xm not found in the repository."
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          brew install ldid dpkg make || true
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mv /tmp/sdks/*.sdk "$HOME/theos/sdks/" || true

      - name: Build dylib
        id: build
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          make clean || true
          make FINALPACKAGE=1 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package deb (optional)
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: make package FINALPACKAGE=1 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Collect output
        if: always()
        run: |
          mkdir -p out
          [ -f build.log ] && cp build.log out/ || true
          find "$PROJECT_DIR" -name "AflatoonSuite.dylib" -not -path "*/arm64/*" -exec cp {} out/ \; || true
          find "$PROJECT_DIR/packages" -name "*.deb" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - name: Fail if dylib missing
        run: |
          if [ ! -f out/AflatoonSuite.dylib ]; then
            echo "::error::dylib was not built. See build.log in the artifact."
            grep -n "error" out/build.log | head -30 || true
            exit 1
          fi
          otool -L out/AflatoonSuite.dylib
          if otool -L out/AflatoonSuite.dylib | grep -qi "substrate\|ellekit"; then
            echo "::error::dylib still depends on Substrate/ElleKit"; exit 1
          fi

      # ---------- اختياري: حقن الـ dylib داخل IPA ----------
      - name: Inject dylib into IPA
        if: ${{ github.event.inputs.ipa_url != '' }}
        run: |
          set -e
          git clone --depth=1 https://github.com/Tyilo/insert_dylib /tmp/insert_dylib
          (cd /tmp/insert_dylib && xcodebuild -configuration Release >/dev/null)
          INSERT=/tmp/insert_dylib/build/Release/insert_dylib

          curl -L --fail -o app.ipa "${{ github.event.inputs.ipa_url }}"
          rm -rf Payload && unzip -q app.ipa
          APP=$(ls -d Payload/*.app | head -1)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"

          mkdir -p "$APP/Frameworks"
          cp out/AflatoonSuite.dylib "$APP/Frameworks/"
          ldid -S "$APP/Frameworks/AflatoonSuite.dylib"
          "$INSERT" --strip-codesign --all-yes "@executable_path/Frameworks/AflatoonSuite.dylib" "$BIN" "$BIN"

          zip -qr out/AflatoonSuite-injected.ipa Payload
          ls -la out

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AflatoonSuite
          path: out/*
          if-no-files-found: error
